[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-mt5-capture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["discord.py==2.6.4", "azure-data-tables==12.7.0", "MetaTrader5==5.0.5509; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["signal_capture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
